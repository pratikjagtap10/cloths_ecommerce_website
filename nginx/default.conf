# API GATEWAY: the single entry point for the browser (http://localhost)
#
#   /api/core/*  -> Django core service   (users, catalog, orders)
#   /api/shop/*  -> FastAPI shop service  (cart, checkout, payments)
#   /admin/      -> Django admin
#   /internal/*  -> BLOCKED (service-to-service only)
#   /            -> Next.js frontend
#
# Benefits: one origin (no CORS problems), internal ports stay hidden, and one
# place for cross-cutting rules such as rate limiting.

# Max 30 login attempts per minute per IP address (brute-force protection)
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    client_max_body_size 5m;

    # Docker's internal DNS. Using variables in proxy_pass makes Nginx look the
    # service name up again (every 10s) instead of once at startup, so rebuilding
    # one container (new IP address) doesn't cause "502 Bad Gateway".
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream http://frontend:3000;
    set $core_upstream     http://core-service:8000;
    set $shop_upstream     http://shop_service:8001;

    # Passed to every backend
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;  # trace one request across services
    add_header X-Request-ID $request_id always;

    location = /api/core/auth/login/ {
        limit_req zone=login_limit burst=10 nodelay;
        limit_req_status 429;
        proxy_pass $core_upstream;
    }

    location /api/core/        { proxy_pass $core_upstream; }
    location /admin/           { proxy_pass $core_upstream; }
    location /django-static/   { proxy_pass $core_upstream; }

    location /api/shop/        { proxy_pass $shop_upstream; }

    location /internal/        { return 404; }

    location / {
        proxy_pass $frontend_upstream;
    }
}
