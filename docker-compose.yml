# Threads cloth store: full local stack
#
#   docker compose up --build -d        start everything      -> http://localhost
#   docker compose ps                   status / health
#   docker compose logs -f shop_service follow one service's logs
#   docker compose down                 stop (data is kept)
#   docker compose down -v              stop AND delete databases
#
# Settings come from the .env file next to this one (copy .env.example).

x-backend-env: &backend-env
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me-0123456789abcdef}
  INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key-change-me}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  EVENTS_CHANNEL: ${EVENTS_CHANNEL:-events}

x-core-env: &core-env
  <<: *backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-django-secret-change-me}
  DJANGO_DEBUG: ${DJANGO_DEBUG:-1}
  JWT_ACCESS_MINUTES: ${JWT_ACCESS_MINUTES:-30}
  JWT_REFRESH_DAYS: ${JWT_REFRESH_DAYS:-7}
  SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
  POSTGRES_HOST: core_db
  POSTGRES_DB: ${CORE_DB_NAME:-core_db}
  POSTGRES_USER: ${CORE_DB_USER:-core}
  POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core}

services:
  # ---------------------------------------------------------------- data stores
  core_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CORE_DB_NAME:-core_db}
      POSTGRES_USER: ${CORE_DB_USER:-core}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core}
    volumes:
      - core_db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # optional: connect from pgAdmin/DBeaver on localhost:5433
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  shop_db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${SHOP_DB_NAME:-shop_db}
      POSTGRES_USER: ${SHOP_DB_USER:-shop}
      POSTGRES_PASSWORD: ${SHOP_DB_PASSWORD:-shop}
    volumes:
      - shop_db_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---------------------------------------------------------------- core service (Django)
  core_service:
    build: ./core_service
    image: cloth-store/core-service:latest
    environment:
      <<: *core-env
    ports:
      - "8000:8000" # direct access for Postman / debugging (normally use the gateway)
    depends_on:
      core_db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/core/health/')"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      default:
        # Django rejects "core_service" as a Host header (underscores are not valid
        # in hostnames, RFC 1034), so other services call it as "core-service".
        aliases: [core-service]

  # Same image, different command: listens for events (payment.succeeded)
  core_worker:
    build: ./core_service
    image: cloth-store/core-service:latest
    command: ["python", "manage.py", "run_event_consumer"]
    environment:
      <<: *core-env
      RUN_STARTUP_TASKS: "0" # migrations are run by core_service
    depends_on:
      core_service: { condition: service_healthy }
    restart: unless-stopped

  # ---------------------------------------------------------------- shop service (FastAPI)
  shop_service:
    build: ./shop_service
    image: cloth-store/shop-service:latest
    environment:
      <<: *backend-env
      SHOP_DB_URL: postgresql+psycopg://${SHOP_DB_USER:-shop}:${SHOP_DB_PASSWORD:-shop}@shop_db:5432/${SHOP_DB_NAME:-shop_db}
      CORE_SERVICE_URL: http://core-service:8000
    ports:
      - "8001:8001"
    depends_on:
      shop_db: { condition: service_healthy }
      redis: { condition: service_healthy }
      core_service: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/shop/health/')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5
    restart: unless-stopped

  # ---------------------------------------------------------------- frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      target: runner
      args:
        NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
        NEXT_PUBLIC_API_URL: "http://localhost/api"
    image: cloth-store/frontend:latest
    environment:
      # Server-side rendering inside Docker reaches the APIs through the gateway
      API_INTERNAL_URL: http://nginx/api
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend-dev:
    profiles: ["dev"]
    build:
      context: ./frontend
      target: dev
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_USE_MOCK: ${NEXT_PUBLIC_USE_MOCK:-false}
      NEXT_PUBLIC_API_URL: "http://localhost/api"
      API_INTERNAL_URL: http://nginx/api
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # ---------------------------------------------------------------- API gateway
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      frontend: { condition: service_started }
      core_service: { condition: service_healthy }
      shop_service: { condition: service_healthy }
    restart: unless-stopped

volumes:
  core_db_data:
  shop_db_data:
